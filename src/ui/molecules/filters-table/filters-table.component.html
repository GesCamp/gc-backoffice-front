<div class="text-foreground font-extrabold">
  <div class="flex flex-wrap gap-4 p-1">
    @for (filter of config(); track filter ) {
    <div class="flex flex-col">
      @if (filter.label) {
      <label class="text-muted-foreground relative grid grid-cols-3 gap-2">{{ filter.label }}</label>

      } @if (filter.type === 'text') {
      <input
        class="py-2 pl-8 pr-2"
        type="text"
        [value]="values()[filter.key] || ''"
        (input)="onChange(filter.key, $any($event.target).value)"
        placeholder="{{ filter.placeholder }}" />
      } @if (filter.type === 'select') {
      <select
        class="py-2 pl-8 pr-2"
        [value]="values()[filter.key] || ''"
        (change)="onChange(filter.key, $any($event.target).value)">
        <option value="">Todos</option>
        @for (opt of filter.options || []; track opt) {
        <option [value]="opt">{{ opt }}</option>
        }
      </select>
      }
    </div>
    }
  </div>
</div>
